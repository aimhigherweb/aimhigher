[build]
  base = "."
  publish = "dist/"
  command = "npm run build"

[context.production.environment]
  NODE_ENV = "production"

[context.dev.environment]
  NODE_ENV = "development"

[[redirects]]
  from = "/docs/*"
  to = "portal.aimhigherweb.dev/docs/:splat"
  status = 302

# Gatsby served the sitemap from /sitemap/; the a11y CI action and .pa11yci still read it there
[[redirects]]
  from = "/sitemap/*"
  to = "/:splat"
  status = 200
